name: EAS Cloud Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - development
          - preview
      message:
        description: "Build note / message"
        required: false
        default: ""
        type: string
      wait:
        description: "Wait for build completion"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*.*.*'      # e.g., v1.0.0, v2.1.3 (triggers production build)
      - 'build-*'     # e.g., build-1.0.0, build-prod (triggers production build)
      - 'dev-*'       # e.g., dev-v1.0.0, dev-1.0.0 (triggers development build)
      - 'build-dev-*' # e.g., build-dev-1.0.0 (triggers development build)

jobs:
  build:
    name: EAS Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve Build Configuration
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "profile=${{ inputs.profile }}" >> $GITHUB_OUTPUT
            echo "wait=${{ inputs.wait }}" >> $GITHUB_OUTPUT
            MSG="${{ inputs.message }}"
            if [ -z "$MSG" ]; then
              MSG="Manual EAS Build (${GITHUB_SHA::7})"
            fi
            echo "message=$MSG" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${{ github.ref_name }}"
            if [[ "$TAG_NAME" == dev-* || "$TAG_NAME" == build-dev-* ]]; then
              echo "profile=development" >> $GITHUB_OUTPUT
            else
              echo "profile=production" >> $GITHUB_OUTPUT
            fi
            echo "wait=true" >> $GITHUB_OUTPUT
            echo "message=Build triggered by tag: $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Trigger EAS Cloud Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          PROFILE="${{ steps.config.outputs.profile }}"
          WAIT="${{ steps.config.outputs.wait }}"
          MSG="${{ steps.config.outputs.message }}"

          ARGS="--platform android --profile $PROFILE --non-interactive"

          if [ "$WAIT" = "false" ]; then
            ARGS="$ARGS --no-wait"
          fi

          if [ -n "$MSG" ]; then
            ARGS="$ARGS --message \"$MSG\""
          fi

          eval "eas build $ARGS"
