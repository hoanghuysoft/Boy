name: Build Development APK

on:
  push:
    branches:
      - "**"

jobs:
  build-android:
    name: Build Android Dev APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform android --clean
        env:
          # Prevent Expo from prompting for login
          EXPO_NO_TELEMETRY: 1

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Comment APK download link on commit
        if: github.event_name == 'push'
        run: |
          echo "✅ Dev APK built successfully!" 
          echo "📦 Download: Go to Actions → This run → Artifacts → dev-apk-${{ github.sha }}"
