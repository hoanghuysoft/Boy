name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - development
      build_message:
        description: "Optional build note"
        required: false
        default: ""

env:
  GRADLE_OPTS: -Xmx512m -Dfile.encoding=UTF-8

jobs:
  build-android:
    name: Android ${{ inputs.profile }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Configure swap space
        run: |
          sudo fallocate -l 4G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          free -h
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Configure Gradle JVM heap
        run: |
          mkdir -p ~/.gradle
          cat <<'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.daemon=false
          kotlin.daemon.jvmargs=-Xmx1536m
          EOF

      - name: Install Bun dependencies
        run: bun install

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Create EAS credentials config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jq -n \
            --arg path "./android.keystore" \
            --arg ksPass "$KEYSTORE_PASSWORD" \
            --arg alias "$KEY_ALIAS" \
            --arg keyPass "$KEY_PASSWORD" \
            '{"android":{"keystore":{"keystorePath":$path,"keystorePassword":$ksPass,"keyAlias":$alias,"keyPassword":$keyPass}}}' \
            > credentials.json

      - name: Build Android APK
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          bunx eas build --local --profile ${{ inputs.profile }} --platform android --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeLove-${{ inputs.profile }}-build-${{ github.run_number }}
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30
